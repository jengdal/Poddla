[project]
name = "poddla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "John Engdal", email = "john@engdal.fi" }]
requires-python = ">=3.14"
dependencies = [
  "bgutil-ytdlp-pot-provider>=1.3.2",
  "datastar-py>=1.0.2",
  "django>=6.1",
  "django-environ>=0.14.0",
  "msgspec>=0.21.1",
  "uvicorn>=0.52.3",
  "httptools>=0.8.0",
  # Copy pasted from the `standard` dependencies section in https://github.com/Kludex/uvicorn/blob/main/pyproject.toml :
  "uvloop>=0.15.1; sys_platform != 'win32' and (sys_platform != 'cygwin' and platform_python_implementation != 'PyPy')",
  "valkey-glide>=2.5.1",
  "yt-dlp>=2026.7.4",
  "yt-dlp-ejs>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__"]
executionEnvironments = [{ root = "src" }]

[tool.bandit]
exclude_dirs = [".venv"]

[tool.docformatter]
recursive = true
wrap-summaries = 100
wrap-descriptions = 100

[tool.ruff]
namespace-packages = ["src/"]
line-length = 100

[tool.ruff.lint]
# W505 warns about too long comments and docstrings.
extend-select = ["W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.uv.build-backend]
# Add every top-level package under src/ here:
module-name = ["poddla", "podcasts", "valkey_changes", "user_settings"]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "django-browser-reload>=1.21.0",
  "django-debug-toolbar>=7.1.1",
  "django-extensions>=4.1",
  "docformatter>=1.7.8",
  "ipython>=9.16.1",
  "ruff>=0.16.3",
  # This installs some additional dev dependencies, like watchfiles:
  "uvicorn[standard]>=0.52.3",
]
