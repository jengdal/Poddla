name: Bandit
on: [push, pull_request]

jobs:
  tests:
    runs-on: nix
    steps:
      - uses: actions/checkout@v7
      - name: Configure Nix
        run: |
          cat >> /etc/nix/nix.conf <<'EOF'
          experimental-features = nix-command flakes
          extra-substituters = https://nix-community.cachix.org https://devenv.cachix.org https://nixpkgs-python.cachix.org
          extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nixpkgs-python.cachix.org-1:hxjI7pFxTyuTHn2NkvWCrAUcNZLNS3ZAvfYNuYifcEU=
          narinfo-cache-negative-ttl = 0
          EOF
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Debug substituter and local store
        run: |
          echo "--- network reachability to nixpkgs-python.cachix.org ---"
          curl -v -o /dev/null https://nixpkgs-python.cachix.org/45dgd81avghmnzmab82qls6qzaaqp81n.narinfo 2>&1 | tail -40
          echo "--- is the derivation already in the local store? ---"
          nix path-info /nix/store/45dgd81avghmnzmab82qls6qzaaqp81n-python3-3.14.6 2>&1 || true
          ls -la /nix/store/ 2>&1 | grep 45dgd81avghmnzmab82qls6qzaaqp81n || echo "not present locally"
          echo "--- raw nix substitution attempt, bypassing devenv entirely ---"
          nix build --dry-run --extra-experimental-features "nix-command flakes" \
            'github:cachix/nixpkgs-python/4d2bd16c09baaa04f4045f16f6a5574654aaba16#packages.x86_64-linux."3.14"' -vvv 2>&1 | tail -60
      - run: devenv --no-tui shell run_bandit
