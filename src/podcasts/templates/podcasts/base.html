<!doctype html>{% load static %}
<html lang="en" class="ui-light">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C52F21" />
    {# <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}" /> #}
    {# <link rel="stylesheet" href="{% static 'vendor/font-awesome/css/all.min.css' %}" /> #}

    <link rel="stylesheet" as="style" href="{% static 'dist/opui.css' %}" />
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/opui-css/dist/opui.css" /> -->

    <script type="module" defer src="{% static 'vendor/datastar.js' %}"></script>

    <link rel="stylesheet" href="{% static 'styles.css' %}" />
    <title>Poddla</title>
    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a href="{% url 'podcasts' %}" class="app-brand">Poddla</a>
        <nav>
          {% if user.is_authenticated %}
          <a href="{% url 'podcasts' %}" class="ui-button ui-small ui-tonal">Podcasts</a>
          <a href="{% url 'add_channel' %}" class="ui-button ui-small ui-tonal">Create Podcast</a>

          <div class="nav-dropdown" data-on:click__outside="$_account_menu_open=false">
            <button
              type="button"
              class="ui-button ui-small ui-tonal nav-dropdown-toggle"
              data-on:click="$_account_menu_open=!$_account_menu_open"
              data-attr:aria-expanded="$_account_menu_open"
              aria-haspopup="menu"
            >
              Menu
              <svg class="nav-dropdown-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <div class="nav-dropdown-menu" role="menu" data-class:open="$_account_menu_open">
              <a href="{% url 'settings' %}" class="nav-dropdown-item" role="menuitem">Poddla Settings</a>
              <hr class="ui-divider" />
              <a href="{% url 'password_change' %}" class="nav-dropdown-item" role="menuitem">Change password</a>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="nav-dropdown-item" type="submit" role="menuitem">Log out</button>
              </form>
            </div>
          </div>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="app-main">
      {% block content %}{% endblock content %}
    </main>
    {% if DEBUG %}<ignore-djt data-ignore data-ignore-morph></ignore-djt>{% endif %}
  </body>
</html>
