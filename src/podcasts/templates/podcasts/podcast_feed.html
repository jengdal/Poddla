{% extends "podcasts/base.html" %}
{% load user_settings_tags %}
{% block extra_head %}
<link rel="alternate" type="application/rss+xml" title="{{ podcast.name }}" href="{% authed_feed_url 'podcast_feed_rss' state.podcast_id %}">
{% endblock extra_head %}
{% block content %}

<div id="podcast-feed-container" data-signals:tab_id="'{{ state.tab_id }}'" data-init="@get('{% url 'podcast_feed_sse' state.podcast_id %}')">
  {% include "podcasts/partials/podcast_feed_content.html" with preview=False %}
</div>
{% endblock content %}
